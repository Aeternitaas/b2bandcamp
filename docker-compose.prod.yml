services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-b2bandcamp}
      MYSQL_USER: ${MYSQL_USER:-b2bandcamp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    # The database is only reachable from the app container; it is intentionally
    # not published to the host.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Loopback-only: Traefik runs with network_mode: host and reaches every
      # backend via 127.0.0.1:<port>, same as the rest of this host's stack.
      # Publishing on 0.0.0.0 here would expose the app on every host
      # interface directly, bypassing Traefik's TLS/auth in front of it.
      - "127.0.0.1:${APP_PORT:-9185}:9185"
    environment:
      PORT: "9185"
      WEB_DIR: /app/web
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-b2bandcamp}
      MYSQL_USER: ${MYSQL_USER:-b2bandcamp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # Set to true once the app is served over HTTPS, so cookies are only ever
      # sent on encrypted connections.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Only needed behind a reverse proxy / real domain, see .env.example.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
