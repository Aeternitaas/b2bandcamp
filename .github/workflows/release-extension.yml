name: Release extension

# Tag push builds and publishes automatically. workflow_dispatch needs no
# input, it reads extension/manifest.json's version on whichever branch you
# run it from (pick that branch from the "Run workflow" dropdown) and tags
# that version itself, rather than expecting a tag to already exist, an
# explicit ref here that does not already exist on the remote is exactly
# what broke this before: actions/checkout failed trying to fetch it.
on:
  push:
    tags:
      - "extension-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: version
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          TAG="extension-v$VERSION"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" != "$TAG" ]; then
            echo "Pushed tag ${{ github.ref_name }} does not match extension/manifest.json version $VERSION (expected $TAG)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag this version
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists on origin, releasing it as-is."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Package extension
        run: |
          mkdir -p dist
          cd extension
          zip -r "../dist/b2bandcamp-extension-${{ steps.version.outputs.version }}.zip" . -x "README.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Extension v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: dist/b2bandcamp-extension-${{ steps.version.outputs.version }}.zip
